services:
  postgres:
    image: postgres:16-alpine
    container_name: productapp-postgres
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - productapp-pgdata:/var/lib/postgresql/data

volumes:
  productapp-pgdata:
