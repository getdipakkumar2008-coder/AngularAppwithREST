<div class="page">
  <div class="form-card">
    <h1>{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h1>

    <p class="state error" *ngIf="error">⚠ {{ error }}</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" formControlName="name" placeholder="e.g. Wireless Mouse" />
        <span class="field-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          Name is required (max 255 characters).
        </span>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="3" placeholder="Short description"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="price">Price ($)</label>
          <input id="price" type="number" step="0.01" formControlName="price" />
          <span class="field-error" *ngIf="form.get('price')?.invalid && form.get('price')?.touched">
            Must be 0 or greater.
          </span>
        </div>

        <div class="field">
          <label for="quantity">Quantity</label>
          <input id="quantity" type="number" formControlName="quantity" />
          <span class="field-error" *ngIf="form.get('quantity')?.invalid && form.get('quantity')?.touched">
            Must be 0 or greater.
          </span>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary" [disabled]="submitting">
          {{ isEditMode ? 'Save Changes' : 'Create Product' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
